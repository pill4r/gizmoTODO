name: Build Electron App

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Vite (Frontend)
        run: bun run build > vite-build.log 2>&1

      - name: Upload Vite Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-log
          path: vite-build.log
          if-no-files-found: ignore

      - name: Build Electron (Packaging)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEBUG: electron-builder
        run: bunx electron-builder --win > electron-builder.log 2>&1

      - name: Upload Electron Builder Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-log
          path: electron-builder.log
          if-no-files-found: ignore

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: promodoro-todo-win
          path: release/*.exe
          if-no-files-found: ignore

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GH_TOKEN }}
        if: github.ref_type == 'tag'
